# ScanIQ Production Nginx Configuration
# OWASP ASVS 5.0 V3.4 Browser Security Mechanism Headers & SPA Routing

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scaniq.app www.scaniq.app;

    root /var/www/scaniq/dist;
    index index.html;

    # SSL Configuration (Example using Let's Encrypt certificates)
    ssl_certificate /etc/letsencrypt/live/scaniq.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scaniq.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OWASP ASVS 5.0 V3.4 Security Headers
    # V3.4.1 Strict-Transport-Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # V3.4.3 Content-Security-Policy & V3.4.6 frame-ancestors
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none';" always;

    # V3.4.4 X-Content-Type-Options
    add_header X-Content-Type-Options "nosniff" always;

    # V3.4.5 Referrer-Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # V3.4.8 Cross-Origin-Opener-Policy & Permissions
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    # SPA Fallback: All routes route to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Cache (Immutable 1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service Worker & Web Manifest (Must revalidate)
    location ~* (sw\.js|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gzip / Brotli Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name scaniq.app www.scaniq.app;
    return 301 https://$host$request_uri;
}
