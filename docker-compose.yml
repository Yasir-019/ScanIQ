services:
  scaniq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scaniq-community
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    read_only: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
