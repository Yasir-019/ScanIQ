name: Release & Asset Integrity

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Verify Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Strict Type Check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint Check
        run: npm run lint

      - name: Automated Tests
        run: npm test -- --run

      - name: Build Production Assets
        run: npm run build

      - name: Package Distribution Tarball & Archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd dist
          tar -czvf "../scaniq-community-${VERSION}.tar.gz" .
          zip -r "../scaniq-community-${VERSION}.zip" .
          cd ..
          sha256sum "scaniq-community-${VERSION}.tar.gz" "scaniq-community-${VERSION}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scaniq-community-${{ github.ref_name }}.tar.gz
            scaniq-community-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
