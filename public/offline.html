<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1014">
  <title>ScanIQ — Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: #0a1014;
      color: #e2e8f0;
      text-align: center;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 400px;
      width: 100%;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      opacity: 0.6;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      font-size: 1rem;
    }
    .features {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .features h2 {
      font-size: 0.875rem;
      font-weight: 500;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    .feature-list {
      list-style: none;
      text-align: left;
    }
    .feature-list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0;
      color: #cbd5e1;
      font-size: 0.9375rem;
    }
    .feature-list li::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #06b6d4;
      border-radius: 50%;
      flex-shrink: 0;
    }
    button {
      margin-top: 2rem;
      padding: 0.875rem 2rem;
      background: #06b6d4;
      color: #0a1014;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #22d3ee;
    }
    button:active {
      transform: scale(0.98);
    }
    .hint {
      margin-top: 1.5rem;
      font-size: 0.8125rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 8v1M12 15v1M8 12h1M15 12h1" stroke-linecap="round"/>
    </svg>

    <h1>You're offline</h1>
    <p>ScanIQ is available offline after first load. Some features require an internet connection.</p>

    <div class="features">
      <h2>Available offline</h2>
      <ul class="feature-list">
        <li>View scan history</li>
        <li>Generate QR codes</li>
        <li>Access saved scans</li>
        <li>App settings</li>
      </ul>
    </div>

    <button onclick="window.location.reload()">Reconnect & Retry</button>

    <p class="hint">Check your internet connection to scan new codes</p>
  </div>

  <script>
    // Auto-reload when back online
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
